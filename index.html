<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GORIE Studio</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="./images/mark-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #150c14;
      --cream: #f6efe7;
      --cream-dim: #c9bdb2;
      --ember: #dc4c2f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ink);
      color: var(--cream);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    main { max-width: 34rem; }
    img { width: 44px; height: auto; border-radius: 6px; margin-bottom: 2.25rem; }
    p.eyebrow {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ember);
      margin: 0 0 1rem;
    }
    h1 {
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 600;
      font-size: clamp(1.5rem, 4.5vw, 2.1rem);
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin: 0 0 1rem;
      text-wrap: balance;
    }
    p.sub { color: var(--cream-dim); line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <main>
    <img src="./images/mark-icon.png" alt="GORIE Studio" />
    <p class="eyebrow">GORIE STUDIO</p>
    <h1>Estamos preparando esta página.</h1>
    <p class="sub">Ela volta ao ar em breve, no endereço definitivo.</p>
  </main>
</body>
</html>
